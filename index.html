<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6fa">
<meta name="description" content="Проведите пробное занятие в роли преподавателя йоги. Шесть коротких вопросов, разбор решений и следующий шаг.">
<link rel="icon" href="data:,">
<title>Сможете провести урок йоги? · Академия Йоги</title>
<style>
:root{
  color-scheme:light; --ink:#20182e; --mute:#5c5468; --paper:#f7f6fa; --line:#ded9e6;
  --white:#fff; --brand:#6031b6; --brand-dark:#4c2692; --lav:#efe7fc; --deep:#211436; --warm:#ffdb76;
  --green:#165b43; --green-bg:#e9f8f0; --amber:#6b4914; --amber-bg:#fff4dd;
  --out:cubic-bezier(.23,1,.32,1); --edge:18px;
  font-family:"Segoe UI Variable Text","Segoe UI",Arial,sans-serif; scrollbar-color:#a99cb8 var(--paper);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--paper)}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
[hidden]{display:none!important}
.wrap{width:min(1180px,calc(100% - 64px));margin-inline:auto}
.masthead{border-bottom:1px solid var(--line);background:#fff}
.mast-row{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand svg{width:35px;height:35px;flex:none}
.brand span{font-size:13px;line-height:1.05;font-weight:850;letter-spacing:.045em}
.brand small{display:block;font-size:8px;letter-spacing:.17em;margin-top:4px}
.top-offer{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:13px;font-weight:780}
.top-offer span{background:#211436;color:#fff;padding:6px 9px;border-radius:6px;font-size:10px;letter-spacing:.055em;text-transform:uppercase}
.top-offer strong{color:var(--brand-dark);white-space:nowrap}
.main{padding-top:24px}
.navline{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.quiz-progress{display:flex;align-items:center;gap:10px;min-width:0}
.progress-label{font-size:12px;font-weight:790;white-space:nowrap}
.track{display:flex;gap:4px;align-items:center;margin:0;padding:0;list-style:none}
.track li{height:5px;width:clamp(13px,2.5vw,34px);border-radius:4px;background:#ded7e9;position:relative;overflow:hidden}
.track li::after{content:"";position:absolute;inset:0;transform:scaleX(0);transform-origin:left;background:var(--brand);transition:transform 205ms var(--out)}
.track li[data-done]::after{transform:scaleX(1)}
.track li[data-current]::after{transform:scaleX(.52);background:#9166da}
.time{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
.ico{width:18px;height:18px;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,1.26fr) minmax(0,1fr);gap:16px;align-items:start}
.play,.visual,.promo{border-radius:var(--edge);overflow:hidden}
.play{background:var(--white);border:1px solid var(--line);padding:clamp(24px,3.25vw,48px);min-height:530px}
.side{display:grid;gap:14px;min-width:0}
.kicker{display:flex;align-items:center;gap:8px;color:var(--brand-dark);font-size:11px;font-weight:850;letter-spacing:.115em;text-transform:uppercase;margin:0 0 14px}
.kicker::before{content:"";height:7px;width:7px;background:var(--brand);border-radius:2px;flex:none}
h1{font-size:clamp(32px,4.4vw,64px);line-height:.99;letter-spacing:-.065em;margin:0;font-weight:850;text-wrap:balance}
h1 span{color:var(--brand)}
h1:focus{outline:none}
.play:not([data-view="welcome"]) h1{font-size:clamp(31px,3.85vw,55px);line-height:1.035;letter-spacing:-.058em}
.lead{font-size:17px;line-height:1.48;margin:14px 0 0;color:var(--mute);max-width:47ch}
.question{margin:21px 0 9px;font-size:15px;font-weight:800;line-height:1.37}
.choice-list{display:grid;gap:8px}
.choice{
  display:grid;grid-template-columns:33px minmax(0,1fr) 18px;align-items:center;gap:11px;
  width:100%;min-height:52px;text-align:left;background:#fff;border:1px solid #d9d1e4;
  border-radius:10px;padding:7px 13px 7px 8px;
  transition:background-color 145ms ease,border-color 145ms ease,transform 120ms var(--out);
}
.choice:active,.solid:active{transform:scale(.989)}
.choice[data-selected]{background:#f2ebff;border-color:#8c64d6}
.choice b{font-weight:750;font-size:15px;line-height:1.24;overflow-wrap:anywhere}
.glyph,.letter{height:33px;width:33px;display:grid;place-items:center;background:var(--lav);color:var(--brand-dark);border-radius:7px}
.letter{font-size:12px;font-weight:850}
.choice>.ico{color:var(--brand-dark);transition:transform 155ms var(--out)}
.small{font-size:12px;line-height:1.45;color:var(--mute);margin:12px 0 0}
.scene-line{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:10px 12px;background:#f4eefc;border-radius:9px;color:var(--brand-dark);font-size:13px;line-height:1.4;font-weight:690;margin:15px 0 0}
.scene-line .ico{width:17px;height:17px}
.nav-actions{display:flex;gap:11px 15px;align-items:center;flex-wrap:wrap;margin-top:14px}
.quiet,.solid,.grant-btn{min-height:43px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:790;text-decoration:none;border-radius:9px;line-height:1.22;transition:background-color 145ms ease,transform 120ms var(--out)}
.quiet{color:var(--brand-dark);background:transparent;border:0;padding:8px 0}
.solid{background:var(--brand);color:#fff;border:1px solid var(--brand);padding:10px 16px}
.grant-btn{background:var(--warm);color:#241a2c;border:1px solid var(--warm);padding:10px 14px;min-height:49px;width:100%}
.visual{background:#e9dcf7;border:1px solid #d9c7eb;min-height:287px;display:grid;grid-template-rows:auto 1fr auto}
.visual-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 9px;gap:8px}
.visual-tag{font-weight:850;font-size:10px;letter-spacing:.085em;text-transform:uppercase;color:#503373}
.visual-index{font-size:11px;font-variant-numeric:tabular-nums;color:#503373;font-weight:800}
.artwork{display:block;width:100%;height:auto;min-height:0;align-self:center}
.artwork.is-studio{margin-bottom:-5px;aspect-ratio:720/375}
.artwork.is-diagram{aspect-ratio:480/209}
.visual-caption{padding:11px 14px;color:#49345d;font-size:12px;line-height:1.35;font-weight:710;background:#f4ecfb}
.promo{background:var(--deep);color:#fff;padding:17px 18px 18px;border:1px solid #34204e}
.promo-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.promo-kicker{text-transform:uppercase;font-size:10px;font-weight:870;letter-spacing:.10em;color:var(--warm)}
.promo-pill{font-size:10px;font-weight:740;color:#eadff8;border:1px solid #705c8c;border-radius:20px;padding:4px 7px;white-space:nowrap}
.amount{font-size:clamp(36px,4.05vw,60px);font-variant-numeric:lining-nums;font-weight:870;line-height:.98;letter-spacing:-.075em;margin:9px 0 0;white-space:nowrap}
.promo p{color:#eee6f6;margin:7px 0 0;font-size:14px;line-height:1.43}
.promo .terms{font-size:12px;line-height:1.43;color:#e4d5f6}
.promo a:not(.grant-btn){text-underline-offset:3px}
.promo .grant-btn{margin-top:13px}
.promo-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:10px;color:#f2e7fa}
.mobile-offer{display:none}
.layout[data-result]{display:block}
.layout[data-result] .side{display:none}
.play[data-view="result"]{min-height:0;padding:0;background:transparent;border:0;overflow:visible}
.result-grid{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:14px;align-items:start;grid-template-areas:"result offer" "course offer" "review review"}
.result-hero,.result-promo,.course-panel,.review-panel{border-radius:var(--edge)}
.result-hero{
  grid-area:result;position:relative;isolation:isolate;overflow:hidden;
  background:#5c31a8;color:#fff;padding:clamp(20px,3vw,36px);min-height:265px;
}
.result-hero-copy{position:relative;max-width:78%}
.result-hero .kicker{color:#fbdf91;margin-bottom:10px}
.result-hero .kicker::before{background:currentColor}
.play[data-view="result"] .result-hero h1{font-size:clamp(32px,3.4vw,49px);text-wrap:pretty;letter-spacing:-.052em}
.result-hero h1 span{color:#ffe09a}
.result-hero .lead{color:#f8efff;margin-top:10px;font-size:15px;max-width:43ch}
.score-pill{
  display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 9px;
  border:1px solid #c5a8ec;border-radius:6px;color:#fff;font-size:12px;font-weight:770;background:#51268f;
}
.score-pill .ico{width:14px;height:14px}
.result-art{position:absolute;width:42%;max-width:235px;height:auto;right:0;bottom:-12px;z-index:-1}
.course-panel{grid-area:course;background:#fff;border:1px solid var(--line);padding:16px 19px}
.course-panel .kicker{margin-bottom:7px}
.course-panel h2,.review-heading{margin:0;font-size:21px;line-height:1.13;letter-spacing:-.03em}
.course-panel>p:not(.kicker){margin:7px 0 0;color:var(--mute);font-size:14px;line-height:1.43}
.course-points{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0 0;padding:0;list-style:none}
.course-points li{background:#f0e8fc;color:#462279;padding:5px 7px;border-radius:5px;font-size:11px;font-weight:770}
.review-panel{grid-area:review;background:#fff;border:1px solid var(--line);padding:18px 19px}
.review-top{display:flex;gap:7px 14px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.review-top .small{margin:0}
.next-tip{background:#f5efff;border:1px solid #e6d9f9;border-radius:10px;padding:10px 12px;margin:12px 0 0;color:#44296a;font-size:13px;line-height:1.43}
.review{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.review li{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.review summary{display:grid;grid-template-columns:21px minmax(0,1fr) 15px;align-items:center;gap:7px;padding:8px 9px;cursor:pointer;list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary>.ico:last-child{width:14px;height:14px;color:var(--brand-dark)}
.review details[open] summary>.ico:last-child{transform:rotate(180deg)}
.review summary .status{display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:900}
.review summary .status.good{background:var(--green-bg);color:var(--green)}
.review summary b{display:block;font-size:12px;line-height:1.22;margin-bottom:2px}
.review summary small{display:block;font-size:13px;line-height:1.28;color:#3d2b56;font-weight:690}
.review details p{margin:0 10px 9px 37px;color:var(--mute);font-size:13px;line-height:1.43}
.result-promo{grid-area:offer;padding:clamp(16px,2.4vw,29px);border-color:#63438f;background:#231437}
.result-promo .amount{color:var(--warm);margin:12px 0 0;font-size:clamp(44px,6.1vw,88px)}
.result-promo .offer-subtitle{color:#fff;font-weight:760;margin-top:5px;font-size:16px}
.result-promo .offer-value{margin-top:9px;font-size:14px}
.result-promo .offer-facts{display:none}
.offer-gift{
  display:grid;grid-template-columns:35px minmax(0,1fr);align-items:center;gap:10px;
  margin-top:13px;padding:10px;background:#3b2458;border:1px solid #765596;border-radius:9px;
}
.gift-icon{display:grid;place-items:center;width:35px;height:35px;background:#ffe09a;color:#462279;border-radius:7px}
.gift-label{display:block;color:#f7d88b;font-size:10px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}
.offer-gift strong{display:block;color:#fff;margin-top:2px;font-size:15px;line-height:1.2}
.offer-gift small{display:block;color:#f0e3fc;margin-top:4px;font-size:12px;line-height:1.35}
.lead-form{margin-top:13px}
.lead-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lead-fields label{display:block;margin-bottom:4px;color:#f8efff;font-size:12px;font-weight:740}
.lead-fields input{
  box-sizing:border-box;width:100%;min-height:44px;padding:8px 9px;border:1px solid #cdbedb;border-radius:7px;
  color:var(--ink);background:#fff;font:inherit;font-size:16px;
}
.lead-fields input::placeholder{color:#6d627a}
.lead-fields input[aria-invalid="true"]{border:2px solid #f6a880}
.lead-status{margin:8px 0 0;color:#ffe4aa;font-size:12px;line-height:1.45}
.lead-status:empty{display:none}
.result-promo .grant-btn{margin-top:9px;min-height:52px;font-size:15px}
.result-promo .grant-btn:disabled{opacity:.72;cursor:default}
.result-promo .grant-btn:focus-visible,.result-promo a:focus-visible,.lead-fields input:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.result-promo .follow-up{margin-top:9px;font-size:12px;color:#f2e7ff;line-height:1.42}
.result-promo .preview-note{margin-top:6px;font-size:12px;color:#f2e7ff}
.result-promo .promo-link{min-height:27px;margin-top:5px}
.result-grid.enter .result-art{animation:enter 245ms var(--out) both;animation-delay:45ms}
.footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 18px;padding:14px 0 19px;font-size:12px;color:var(--mute)}
.footer a{color:var(--brand-dark);text-underline-offset:3px}
.enter{animation:enter 200ms var(--out) both}
.enter .choice{animation:enter 175ms var(--out) both}
.enter .choice:nth-child(2){animation-delay:25ms}.enter .choice:nth-child(3){animation-delay:50ms}.enter .choice:nth-child(4){animation-delay:75ms}
.enter .artwork .beat{animation:enter 245ms var(--out) both;transform-origin:center;transform-box:fill-box}
.enter .artwork .beat:nth-of-type(2){animation-delay:35ms}.enter .artwork .beat:nth-of-type(3){animation-delay:60ms}
@keyframes enter{from{opacity:.24;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover) and (pointer:fine){
  .choice:hover{background:#f7f2ff;border-color:#a587d5}.choice:hover>.ico{transform:translateX(3px)}
  .quiet:hover,.top-offer:hover{text-decoration:underline;text-underline-offset:3px}
  .solid:hover{background:var(--brand-dark)}.grant-btn:hover{background:#ffe39b}
}
@media(max-width:860px){
  .wrap{width:calc(100% - 40px)}.layout{gap:11px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .side{gap:11px}.play{padding:24px}.visual{min-height:0}
  .result-grid{gap:11px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .result-hero-copy{max-width:88%}
}
@media(max-width:680px){
  .wrap{width:calc(100% - 28px)}.mast-row{min-height:55px}.brand svg{width:31px;height:31px}
  .top-offer{gap:5px;font-size:11px}.top-offer span{font-size:8px;padding:5px 6px}
  .main{padding-top:12px}.navline{margin-bottom:10px;gap:6px}
  .quiz-progress{gap:7px}.progress-label,.time{font-size:11px}
  .time .ico{width:15px;height:15px}.track{gap:3px}
  .layout{display:block}.play{padding:19px 15px 17px;min-height:0;border-radius:14px}
  .side{margin-top:11px}.layout:not([data-result]) .side{display:none}
  .kicker{font-size:10px;letter-spacing:.08em;margin-bottom:9px}
  h1{font-size:clamp(33px,9.6vw,51px);line-height:1.02}
  .play:not([data-view="welcome"]) h1{font-size:clamp(30px,8.2vw,45px)}
  .lead{font-size:15px;margin-top:10px}.question{margin-top:15px;font-size:14px}
  .choice{min-height:48px;gap:8px;padding-right:9px}.choice b{font-size:14px}
  .choice-list{gap:6px}.mobile-offer{display:grid;grid-template-columns:1fr minmax(77px,36%);align-items:center;gap:5px;margin-top:13px;overflow:hidden;background:#241738;color:#fff;border-radius:9px;min-height:65px}
  .mobile-offer p{margin:0;padding:8px 0 8px 10px;font-size:11px;line-height:1.25;color:#efe6fa}
  .mobile-offer strong{display:block;font-size:18px;line-height:1.16;color:var(--warm);letter-spacing:-.045em;white-space:nowrap}
  .mobile-offer .artwork{height:72px;width:100%;object-fit:cover}
  .result-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"result" "offer" "course" "review";gap:10px}
  .result-hero{min-height:0;padding:16px 14px;border-radius:14px}
  .result-hero-copy{max-width:100%}
  .play[data-view="result"] .result-hero h1{font-size:clamp(29px,8.1vw,43px)}
  .result-hero .lead{font-size:14px;max-width:35ch}
  .result-art{width:39%;right:-6px;bottom:-16px;opacity:.37}
  .score-pill{margin-top:10px}
  .result-promo,.course-panel,.review-panel{padding:14px;border-radius:14px}
  .result-promo .amount{font-size:54px;margin-top:8px}
  .result-promo .offer-facts{display:block;color:#f0e3fc;font-size:12px;margin-top:5px}
  .offer-gift,.lead-form{margin-top:10px}
  .course-panel h2,.review-heading{font-size:20px}
  .footer{padding:12px 0;font-size:11px}.review summary{padding:7px 8px}
}
@media(max-width:350px){.top-offer span{display:none}.track li{width:12px}.time{font-size:10px}.play{padding-inline:12px}}
@media(max-width:350px){.lead-fields{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.track li[data-current],.track li[data-done]{border:1px solid Highlight}.choice[data-selected]{outline:1px solid Highlight}:root{scrollbar-color:auto}}
</style>
</head>

      status.textContent = 'Заявка принята. Приёмная комиссия свяжется с вами.';
    } catch {
      button.disabled = false;
      status.textContent = 'Не удалось отправить заявку. Попробуйте ещё раз.';
    }
  });
  render();
})();

/* QUIZ_SOURCE_END */
</script>
